name: OpenCode bump

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target WordPress major.minor
        required: true
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    uses: Laserology/wp-plugin-workflows/.github/workflows/opencode-bump-shared.yml@v1
    with:
      target: ${{ github.event.inputs.target || '' }}
      issue-title: 'WordPress compatibility check'
      trigger-command: '/oc'
      plugin-paths: |
        open-forms
        open-forms-for-wc
      readme-paths: |
        open-forms/readme.txt
        open-forms-for-wc/readme.txt
      model: opencode-go/deepseek-v4.1-flash
      timeout-minutes: '30'
    secrets: inherit
